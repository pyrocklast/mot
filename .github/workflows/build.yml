# Checks every push: unit tests, Android lint and an (unsigned) release build, with its size in
# the run summary and the APK kept for a few days. Nothing is published; use the Release workflow for that.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Report the APK's size
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Release APK: $(stat -c %s "$apk") bytes ($(du -h "$apk" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      # A debug-signed APK is installable for device validation, unlike the unsigned release APK.
      - name: Keep the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
