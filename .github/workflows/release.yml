# Validates, builds, signs and publishes an APK for Obtainium.
#
# Run it from the repository's Actions tab: Release > Run workflow.
# Needs KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (KEY_ALIAS and KEY_PASSWORD are optional).

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # This job has read-only repository permissions and does not receive signing secrets.
      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Work out the version
        id: version
        run: |
          # 0.1 plus this workflow's run number: 0.1.1, 0.1.2…; the run number is also the version code
          echo "name=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MOT_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          MOT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Optional secrets: the alias defaults to "lite"; the key password defaults to the store password.
          MOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lite' }}
          MOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease "-PmotVersionName=$VERSION" "-PmotVersionCode=$CODE"
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "$apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          cp "$apk" "mot-launcher-$VERSION.apk"
          gh release create "v$VERSION" "mot-launcher-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "mot launcher $VERSION" \
            --notes "Built by the Release workflow from commit $GITHUB_SHA."

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
