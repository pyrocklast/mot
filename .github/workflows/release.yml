# Builds a signed APK and publishes it as a GitHub release, which Obtainium then offers as an update.
#
# Run it from the repository's Actions tab: Release > Run workflow.
# Needs the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (KEY_ALIAS and KEY_PASSWORD are optional).

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Work out the version
        id: version
        run: |
          # 0.1 plus this workflow's run number: 0.1.1, 0.1.2…; the run number is also the version code
          echo "name=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MOT_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          MOT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Optional secrets: the alias defaults to "lite" (the key made for llauncher), the key password to the keystore's
          MOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lite' }}
          MOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease "-PmotVersionName=$VERSION" "-PmotVersionCode=$CODE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          # Gradle names the APK app-release-unsigned.apk when signing didn't happen
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was built. Check the signing secrets."
            exit 1
          fi
          cp "$apk" "mot-$VERSION.apk"
          gh release create "v$VERSION" "mot-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "mot. $VERSION" \
            --notes "Built by the Release workflow from commit $GITHUB_SHA."

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
        
